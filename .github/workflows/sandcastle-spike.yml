name: Sandcastle spike

# Runs the credential-free sandbox checks (spike/check-sandbox.ts) on Linux:
# real runner UID, fresh Docker cache, plus the symlinked-repo-path scenarios.
# Throwaway — lives on the sandcastle-spike branch only.

on:
  push:
    branches: [sandcastle-spike]
    paths: ['spike/**', '.github/workflows/sandcastle-spike.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install spike dependencies
        working-directory: spike
        run: npm ci

      - name: Build spike image with the runner's UID/GID
        working-directory: spike
        run: |
          docker build -t jig-spike \
            --build-arg AGENT_UID=$(id -u) --build-arg AGENT_GID=$(id -g) .

      - name: Run sandbox checks
        working-directory: spike
        run: npx tsx check-sandbox.ts
